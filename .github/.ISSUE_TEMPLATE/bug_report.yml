name: Bug report
description: Report reproducible unexpected behavior in yaml2video.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove any private media, credentials, or personal data from the project YAML and logs.
  - type: input
    id: version
    attributes:
      label: yaml2video version
      description: Include the release tag or the commit SHA.
      placeholder: v1.2.3
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: macOS 15 arm64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Include the exact command, including `-t`, `-o`, and `-work-dir` options.
      render: shell
    validations:
      required: true
  - type: textarea
    id: project
    attributes:
      label: Minimal project YAML
      description: Provide a minimal reproducible project. Redact or replace private asset paths.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Include the full error or relevant FFmpeg output.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I can reproduce this with the YAML and command above.
          required: true

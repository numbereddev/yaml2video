$schema: ../../docs/template.schema.json
version: 2
template_id: office-mobility-advanced
description: "The simple template plus every newer feature: named classic and custom layouts with variables, advanced keyframes, presets, tracks, element clips, custom transitions, and a master bus."

format:
    aspect_ratio: "9:16"
    width: 1080
    height: 1920
    fps: 30

defaults:
    theme:
        background: "#101820"
        text_color: "#FFFFFF"
        accent_color: "#7DE2A8"
        muted_color: "#B9C5C8"
    typography:
        font_family: "Inter"
        title_size: 88
        body_size: 52
        tip_size: 38
    timing:
        intro_duration: 3s
        slide_duration: 3s
        outro_duration: 3s
        # No default transition: unless a section sets one, scenes cut.
    media:
        default_fit: contain
    audio:
        default_volume: 0.3
        fade_in: 0.2s
        fade_out: 0.8s
        # Audio clips with `ducks: true` push the music down while they play.
        ducking:
            enabled: true
            amount: 0.6

composition:
    sections:
        - id: intro
          role: intro
          source: content.intro
          # The section picks a named custom layout instead of layout.intro.
          layout: opener
          # A custom transition from advanced.transitions, used like a built-in.
          transition_out: { type: flash-cut }
        - id: exercises
          role: slide
          source: content.slides
          repeat: true
          duration_from: item.duration
          # A list rotates: slide 1 → slide-left, slide 2 → smooth-up, slide 3 → slide-left.
          transition_out:
              - { type: slide-left, duration: 0.4s }
              - { type: smooth-up, duration: 0.4s }
        - id: outro
          role: outro
          source: content.outro
          # Only the in side: the last slide's blend stays, the outro zooms in out of a blur.
          transition_in: { type: zoom-blur }

layout:
    # The classic role default; the intro section above chooses "opener" instead.
    intro:
        background: "#101820"
        logo:
            placement:
                anchor: top-center
                offset_y: 120
            max_width_ratio: 0.28
            fit: contain
        title:
            placement:
                anchor: center
            style:
                font_size: 88
                weight: bold
                color: "#FFFFFF"
                align: center
            max_lines: 3
            max_width_ratio: 0.82
            effects:
                - type: text_glow
                  color: "#7DE2A8"
                  opacity: 0.6
                  blur: 4
        subtitle:
            placement:
                anchor: bottom-center
                offset_y: -220
            style:
                font_size: 42
                color: "#B9C5C8"
                align: center
            max_lines: 2
            max_width_ratio: 0.82

    # The default slide layout is an alias for the classic "card" layout, so
    # tracks can attach to "card" without touching slides on other layouts.
    slide: card

    card:
        background: "#101820"
        image:
            placement:
                anchor: top-center
                offset_y: 170
            max_width_ratio: 0.82
            max_height_ratio: 0.48
            fit: contain
        text:
            placement:
                anchor: center
                offset_y: 260
            style:
                font_size: 58
                weight: bold
                color: "#FFFFFF"
                align: center
            max_lines: 3
            max_width_ratio: 0.82
        tip:
            placement:
                anchor: bottom-center
                offset_y: -190
            style:
                font_size: 38
                color: "#7DE2A8"
                align: center
            max_lines: 3
            max_width_ratio: 0.84

    # An alias: the outro uses the custom "closing" layout below.
    outro: closing

    # A named classic variant: the usual slide fields, with the image below the text.
    slide-image-low:
        background: "#0C2A24"
        text:
            placement: { anchor: top-center, offset_y: 230 }
            style: { font_size: 64, weight: bold, color: "#FFFFFF", align: center }
            max_lines: 2
            max_width_ratio: 0.84
        image:
            placement: { anchor: center, offset_y: 140 }
            max_width_ratio: 0.82
            max_height_ratio: 0.42
            fit: contain
            shape: rounded-rectangle
        tip:
            placement: { anchor: bottom-center, offset_y: -170 }
            style: { font_size: 38, color: "#7DE2A8", align: center }
            max_lines: 2
            max_width_ratio: 0.84

    # A custom intro, chosen by the intro section's `layout:`. Elements stack in order.
    opener:
        background: "#0C2A24"
        elements:
            - type: circle
              width: 880
              height: 880
              color: "#16323A"
              placement: { anchor: center, offset_y: -40 }
              keyframes: pop-in
            - type: image
              path: $(logo)
              placement: { anchor: top-center, offset_y: 150 }
              max_width_ratio: 0.5
              max_height_ratio: 0.12
              fit: contain
              optional: true                 # skipped when the video has no logo
              keyframes: pop-in
            - type: text
              id: headline
              text: $(title)
              placement: { anchor: center, offset_y: -60 }
              style: { font_size: 92, weight: bold, align: center }
              max_width_ratio: 0.72
              max_lines: 3
              effects: [{ type: text_glow, color: "#7DE2A8", opacity: 0.6, blur: 4 }]
              keyframes: [{ use: pop-in }, { use: fade-out-end }]
            - type: text
              text: $(subtitle|Drei Übungen für zwischendurch)
              placement: { anchor: center, offset_y: 170 }
              style: { font_size: 40, color: "#7DE2A8", align: center }
              max_width_ratio: 0.72
              max_lines: 2
              keyframes: rise-in
        # Layout tracks repeat in every scene using this layout: here, a slow
        # camera push across the whole intro.
        tracks:
            - id: intro-camera
              clips:
                  - type: effect
                    keyframes:
                        - { at: 0s, scale: 1 }
                        - { at: -0s, scale: 1.06 }

    # A fully custom slide layout: no predefined fields, only $(VARIABLES).
    stat:
        background: "#7DE2A8"
        duration: 3s                         # the scene length unless the item sets one
        elements:
            - type: image                    # only when the slide has an image
              path: $(image)
              placement: { anchor: center }
              max_width_ratio: 1
              max_height_ratio: 1
              fit: cover
              opacity: 0.25
              optional: true
            - type: text
              text: $(label|GUT ZU WISSEN)
              placement: { anchor: top-center, offset_y: 230 }
              style: { font_size: 40, weight: bold, color: "#16323A", align: center }
              max_width_ratio: 0.8
              max_lines: 1
            - type: text
              id: number
              text: $(NUMBER)
              placement: { anchor: center, offset_y: -180 }
              style: { font_size: 300, weight: bold, color: "#101820", align: center }
              max_width_ratio: 0.9
              max_lines: 1
              keyframes:
                  - { at: 0.2s, scale: 1.8, opacity: 0, ease: back-out }
                  - { at: 0.7s, scale: 1, opacity: 1 }
            - type: text
              text: $(UNIT|Minuten)
              placement: { anchor: center, offset_y: 40 }
              style: { font_size: 64, weight: bold, color: "#101820", align: center }
              max_width_ratio: 0.9
              max_lines: 1
            - type: rect
              width: 160
              height: 10
              color: $(ACCENT|#101820)
              placement: { anchor: center, offset_y: 150 }
              start: 0.5s
              keyframes: [{ at: 0s, scale_x: 0, ease: ease-out }, { at: 0.4s, scale_x: 1 }]
            - type: text
              id: caption
              text: $(CAPTION)
              placement: { anchor: center, offset_y: 290 }
              style: { font_size: 44, color: "#16323A", align: center }
              max_width_ratio: 0.8
              max_lines: 3
              keyframes: rise-in
            - type: progress
              placement: { anchor: bottom-center, offset_y: -140 }
              color: "#101820"
              background_color: "#5CC48D"
              width_ratio: 0.6
            # Layout audio: a pop when the number lands.
            - type: audio
              path: assets/pop.wav
              start: 0.45s
              duration: 0.4s
              volume: 0.7
              fade_in: 0.01s
              fade_out: 0.1s
            # An effect element grades everything listed above it.
            - type: effect
              effects: [{ type: vignette, opacity: 0.35 }]

    # The custom outro: logo, title, text, and a solid call-to-action button.
    closing:
        background: "#101820"
        elements:
            - type: image
              path: $(logo)
              placement: { anchor: top-center, offset_y: 160 }
              max_width_ratio: 0.28
              max_height_ratio: 0.1
              fit: contain
              optional: true
            - type: text
              id: title
              text: $(title)
              placement: { anchor: center, offset_y: -40 }
              style: { font_size: 76, weight: bold, align: center }
              max_width_ratio: 0.84
              max_lines: 3
              keyframes: pop-in
            - type: text
              text: $(text|Bis zum nächsten Mal!)
              placement: { anchor: center, offset_y: 200 }
              style: { font_size: 42, color: "#B9C5C8", align: center }
              max_width_ratio: 0.84
              max_lines: 2
              keyframes: rise-in
            - type: text
              id: cta
              text: $(cta)
              placement: { anchor: bottom-center, offset_y: -240 }
              style: { font_size: 42, weight: bold, color: "#101820", align: center }
              max_width_ratio: 0.8
              max_lines: 1
              effects: [{ type: glass_panel, color: "#7DE2A8", opacity: 0.95, padding: [28, 22] }]
        tracks:
            # A pop that ducks the music as the outro lands; volume keyframes shape it.
            - id: outro-sound
              clips:
                  - type: audio
                    path: assets/pop.wav
                    start: 0.1s
                    duration: 0.35s
                    volume: 0.9
                    fade_in: 0.01s
                    fade_out: 0.1s
                    ducks: true
                    keyframes:
                        - { at: 0s, volume: 0.4, ease: ease-out }
                        - { at: 0.1s, volume: 1 }
            # A white flash with chromatic split into the outro.
            - id: outro-hit
              clips:
                  - type: effect
                    duration: 0.5s
                    effects:
                        - { type: tint, color: "#FFFFFF", opacity: 0.6 }
                        - { type: rgb_split, amount: 8 }
                    keyframes:
                        - { at: 0s, opacity: 1, ease: ease-out }
                        - { at: 0.5s, opacity: 0 }

advanced:
    master:
        loudness: -16

    # Reusable keyframes: times are relative to the element or clip; negative
    # times count back from its end.
    keyframes:
        pop-in:
            - { at: 0s, scale: 0.6, opacity: 0, ease: back-out }
            - { at: 0.5s, scale: 1, opacity: 1 }
        rise-in:
            - { at: 0.2s, y: 60, opacity: 0, ease: ease-out }
            - { at: 0.7s, y: 0, opacity: 1 }
        fade-out-end:
            - { at: -0.4s, opacity: 1, ease: ease-in }
            - { at: -0s, opacity: 0 }

    # Reusable effect-layer stacks.
    effects:
        soft-grade:
            - { type: color, saturation: 1.1, contrast: 1.05 }
            - { type: vignette, opacity: 0.3 }

    # Custom transitions, usable by name like built-ins (videos can add their own).
    transitions:
        # No base: a hard cut, hidden by a white flash across the boundary.
        flash-cut:
            duration: 0.4s
            effects: [{ type: tint, color: "#FFFFFF", opacity: 0.85 }]
            keyframes:
                - { at: 0s, opacity: 0, ease: ease-in }
                - { at: 0.2s, opacity: 1, ease: ease-out }
                - { at: 0.4s, opacity: 0 }
        # Separate sides: the outgoing scene zooms into a blur, the incoming one out of it.
        zoom-blur:
            duration: 0.3s
            out:
                effects: [{ type: blur, radius: 10 }]
                keyframes: [{ at: 0s, scale: 1, ease: ease-in }, { at: -0s, scale: 1.35 }]
            in:
                effects: [{ type: blur, radius: 10 }]
                keyframes: [{ at: 0s, scale: 1.35, ease: ease-out }, { at: -0s, scale: 1 }]
        # A custom blend: an iris opening from the center. P runs from 0 to 1.
        iris:
            duration: 0.6s
            expr: "if(lt(hypot(X-W/2,Y-H/2),P*hypot(W/2,H/2)),B,A)"

    # Keyframes for classic layout elements (custom layouts carry their own).
    animate:
        slide:
            image:
                keyframes:
                    - { at: 0s, scale: 0.9, rotation: -3, ease: back-out }
                    - { at: 0.6s, scale: 1, rotation: 0, ease: linear }
                    - { at: -0s, scale: 1.04 }
            text: { keyframes: rise-in }

    # Template tracks repeat for every scene they attach to.
    tracks:
        - id: slide-counter
          attach: slide
          clips:
              - type: circle
                width: 120
                height: 120
                color: "#7DE2A8"
                placement: { anchor: top-right, offset_x: -60, offset_y: 60 }
                keyframes: pop-in
              - type: text
                text: "$(index)/$(total)"
                placement: { anchor: top-right, offset_x: -60, offset_y: 98 }
                style: { font_size: 38, weight: bold, color: "#101820", align: center }
                max_width_ratio: 0.111
                max_lines: 1
                keyframes: pop-in

        # Attached by layout name: only slides on the "card" layout get the bar.
        - id: accent-bar
          attach: card
          clips:
              - type: rect
                width: 240
                height: 8
                corner_radius: 4
                color: "#7DE2A8"
                placement: { anchor: center, offset_y: 180 }
                start: 0.3s
                keyframes:
                    - { at: 0s, scale_x: 0, ease: ease-out }
                    - { at: 0.4s, scale_x: 1 }

        # Element clips change layout elements in place: each slide's text
        # pops and turns green for a moment, then returns to normal.
        - id: highlight-text
          attach: slide
          clips:
              - type: element
                target: text
                start: 1.4s
                duration: 0.8s
                set: { style: { color: "#7DE2A8" } }
                keyframes:
                    - { at: 0s, scale: 1.2, ease: back-out }
                    - { at: 0.4s, scale: 1 }

        # Attached by layout name: every scene using "stat". Element clips modify
        # the layout's own elements: the number becomes "8+" with a pop, and the
        # caption swaps text for the rest of the scene.
        - id: count-up
          attach: stat
          clips:
              - type: element
                target: number
                start: 1.5s
                set: { text: "$(NUMBER)+", style: { color: "#16323A" } }
                keyframes:
                    - { at: 0s, scale: 1.3, ease: back-out }
                    - { at: 0.4s, scale: 1 }
              - type: element
                target: caption
                start: 1.5s
                set: { text: "$(CAPTION_LATE|Zeit für eine Pause!)" }

        # A label badge for slides that have a label; `optional` skips the
        # others, and the offset starts the whole track 0.3 s into each slide.
        - id: label-badge
          attach: slide
          offset: 0.3s
          clips:
              - type: text
                text: $(label)
                optional: true
                placement: { anchor: top-left, offset_x: 70, offset_y: 80 }
                style: { font_size: 30, weight: bold, color: "#101820", align: center }
                max_width_ratio: 0.3
                max_lines: 1
                effects: [{ type: glass_panel, color: "#7DE2A8", opacity: 0.95, padding: [20, 12] }]

        # A tip badge on slides using the image-low variant (attached by layout
        # name), when the slide's item gives a BADGE variable.
        - id: tip-badge
          attach: slide-image-low
          clips:
              - type: text
                text: $(BADGE)
                optional: true
                placement: { anchor: bottom-center, offset_y: -70 }
                style: { font_size: 34, weight: bold, color: "#101820", align: center }
                max_width_ratio: 0.6
                max_lines: 1
                effects:
                    - { type: glass_panel, color: "#7DE2A8", opacity: 0.95, padding: [24, 14] }
                start: 0.5s
                duration: 2s

        # A title watermark; the video drops it with disable_tracks.
        - id: watermark
          attach: video
          clips:
              - type: text
                text: $(metadata.title)
                placement: { anchor: bottom-center, offset_y: -40 }
                style: { font_size: 26, color: "#B9C5C8", align: center }
                max_width_ratio: 0.9
                max_lines: 1

        - id: grade
          attach: video
          clips:
              - type: effect
                effects: soft-grade

# Run from the repository root:
# go run . -n -t examples/templates/appdemo-template.yaml examples/templates/appdemo-project.yaml
version: 1
video:
    width: 320
    height: 240
    fps: 10
    background: "#202020"
defaults:
    text:
        font: "DejaVu Sans"
        size: 28
        color: white
music:
    path: examples/sample_data/music.wav
    volume: 1

slides:
    - type: intro
      image: examples/sample_data/red.png
      text: Stadt Stuttgart

    - type: screenshot
      image: examples/sample_data/blue.png
      textline1: Unfälle in Stuttgart?
      textline2: Kein Problem mehr!
      textline3: Mit der neuen
      textline4: Unfall-Atlas-App

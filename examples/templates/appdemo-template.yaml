slide_templates:
    - name: intro
      required: [image, text]
      duration: 2s
      background: "#112233"
      layers:
          - type: image
            path: "{{image}}"
            fit: cover
            transform: center
          - type: text
            text:
                - "{{text}}"
            transform: bottom-center

    - name: screenshot
      required: [image, textline1, textline2, textline3, textline4]
      duration: 3s
      background: "#334455"
      layers:
          - type: image
            path: "{{image}}"
            fit: cover
            transform: center
          - type: rectangle
            color: "white"
            width: 300
            height: 2
            transform:
                x: 0.5
                y: 0.1
          - type: text
            background:
                color: "rgba(0,0,0,0.7)"
                radius: 10
                padding: [10, 4]
            text:
                - content: "{{textline1}}"
                - content: "\n{{textline2}}"
                  color: "#FFD400"
                - content: "\n{{textline3}}"
                - content: "\n{{textline4}}"
            transform: center

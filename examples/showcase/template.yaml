                        text: "grain",
                        placement: { anchor: center, offset_y: 520 },
                        style:
                            {
                                font_size: 44,
                                font_family: "Fira Code",
                                weight: bold,
                                color: "#0B0B0D",
                                align: center,
                            },
                        max_width_ratio: 1,
                        max_lines: 1,
                    }
            - type: folder
              start: 2.5s

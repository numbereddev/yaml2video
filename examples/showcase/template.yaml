              max_lines: 1
              keyframes: rise
            - {
                  type: rect,
                  width: 52,
                  height: 460,
                  corner_radius: 26,
                  color: "#D7FF3E",
                  placement: { anchor: center, offset_x: -400, offset_y: 30 },
                  keyframes: pulse-d,
              }
            - {
                  type: rect,
                  width: 52,
                  height: 460,
                  corner_radius: 26,
                  color: "#D7FF3E",
                  placement: { anchor: center, offset_x: -320, offset_y: 30 },
                  keyframes: pulse-c,
              }
            - {
                  type: rect,
                  width: 52,
                  height: 460,
                  corner_radius: 26,
                  color: "#D7FF3E",
                  placement: { anchor: center, offset_x: -240, offset_y: 30 },
                  keyframes: pulse-b,
              }
            - {
                  type: rect,
                  width: 52,
                  height: 460,
                  corner_radius: 26,
                  color: "#D7FF3E",
                  placement: { anchor: center, offset_x: -160, offset_y: 30 },
                  keyframes: pulse-a,
              }
            - {
                  type: rect,
                  width: 52,
                  height: 460,
                  corner_radius: 26,
                  color: "#D7FF3E",
                  placement: { anchor: center, offset_x: -80, offset_y: 30 },

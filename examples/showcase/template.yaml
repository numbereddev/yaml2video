$schema: ../../docs/template.schema.json
version: 2
template_id: yaml2video-promo
description: "Scene templates for vertical yaml2video promos: ink, paper and one volt accent; Clash Display headlines, Fira Code for anything that is code. Every layout carries its own timing, transitions, motion and sound, so a video only picks scenes and fills their variables."

format:
    aspect_ratio: "9:16"
    width: 1080
    height: 1920
    fps: 30
    crf: 15

defaults:
    theme:
        background: "#0B0B0D"
        text_color: "#F3F1EA"
        accent_color: "#D7FF3E"
        muted_color: "#6E6E78"
    typography:
        font_family: "Clash Display Variable"
        title_size: 120
        body_size: 48
    timing:
        intro_duration: 3s
        slide_duration: 2s
        outro_duration: 3.5s
    audio:
        default_volume: 0.8
        # Audio clips with `ducks: true` push the music down while they play.
        ducking:
            enabled: true
            amount: 0.55
            attack: 0.05s
            release: 0.3s

composition:
    sections:
        - { id: intro, role: intro, source: content.intro, layout: hook }
        - { id: s, role: slide, source: content.slides, repeat: true, duration_from: item.duration }
        - { id: outro, role: outro, source: content.outro, layout: end }

# Scene lengths are chosen for a 120 BPM bed: every scene starts on a beat
# (a scene's length minus its out-transition overlap is a multiple of 0.5 s).
layout:
    intro: hook
    slide: shout
    outro: end

    # ── Hook: three stacked lines, the last one slams in, in volt ────────────
    hook:
        background: "#0B0B0D"
        duration: 3.35s
        transition_out: { type: zoom-blur }
        elements:
            - type: image
              path: assets/grid.png
              placement: { anchor: center }
              fit: cover
              opacity: 0.7
              effects:
                  [
                      {
                          type: pan_zoom,
                          from_scale: 1,
                          to_scale: 1.08,
                          from_anchor: center,
                          to_anchor: top-center,
                      },
                  ]
            - type: folder
              id: lines
              # The three lines drift up together while each animates on its own.
              keyframes: [{ at: 0s, y: 30, ease: ease-out }, { at: -0s, y: -20 }]
              clips:
                  - type: text
                    text: $(L1)
                    placement: { anchor: center, offset_y: -250 }
                    style: { font_size: 150, weight: bold, align: center, word_spacing: 26 }
                    max_width_ratio: 1
                    max_lines: 1
                    keyframes: rise
                  - type: text
                    text: $(L2)
                    start: 0.5s
                    placement: { anchor: center, offset_y: -70 }
                    style: { font_size: 150, weight: bold, align: center, word_spacing: 26 }
                    max_width_ratio: 1
                    max_lines: 1
                    keyframes: rise
                  - type: text
                    text: $(L3)
                    start: 1s
                    placement: { anchor: center, offset_y: 120 }
                    style:
                        {
                            font_size: 150,
                            weight: bold,
                            color: "#D7FF3E",
                            align: center,
                            word_spacing: 26,
                        }
                    max_width_ratio: 1
                    max_lines: 1
                    effects: [{ type: text_glow, color: "#D7FF3E", opacity: 0.35, blur: 10 }]
                    keyframes: slam
                  - type: text
                    text: $(FOOT)
                    start: 1.75s
                    placement: { anchor: center, offset_y: 400 }
                    style:
                        { font_size: 36, font_family: "Fira Code", color: "#6E6E78", align: center }
                    max_width_ratio: 1
                    max_lines: 1
                    keyframes: rise
            # One tick per line, a sub hit when the volt line lands.
            - { type: audio, path: assets/sfx-tick.wav, start: 0.02s, duration: 0.3s, volume: 0.55 }
            - { type: audio, path: assets/sfx-tick.wav, start: 0.5s, duration: 0.3s, volume: 0.55 }
            - { type: audio, path: assets/sfx-impact.wav, start: 1s, duration: 1.8s, volume: 0.9 }
        tracks:
            - id: hook-camera
              clips:
                  - type: effect
                    keyframes: [{ at: 0s, scale: 1 }, { at: -0s, scale: 1.05 }]

    # ── Code editor: a folder of yaml2video primitives over one card image ──
    # The video supplies the code as aligned color layers (spaces elsewhere)
    # and the typing/cursor presets; everything else is fixed here.
    code:
        background: "#0B0B0D"
        duration: 4s
        transition_out: { type: punch }
        elements:
            - type: text
              text: $(TOP)
              placement: { anchor: top-center, offset_y: 250 }
              style: { font_size: 104, weight: bold, align: center, word_spacing: 18 }
              max_width_ratio: 1
              max_lines: 1
              keyframes: rise
            - type: folder
              id: editor
              keyframes:
                  - { at: 0s, y: 160, scale: 0.92, opacity: 0, ease: back-out }
                  - { at: 0.5s, y: 0, scale: 1, opacity: 1 }
              clips:
                  - type: image
                    id: card
                    path: assets/code-card.png
                    placement: { anchor: center, offset_y: 10 }
                    max_width_ratio: 0.852
                    max_height_ratio: 0.2917
                    fit: contain
                  - type: text
                    text: $(FILE|video.yaml)
                    placement: { anchor: center-right, offset_x: -120, offset_y: -228 }
                    style: { font_size: 28, font_family: "Inter", color: "#6E6E78", align: right }
                    max_width_ratio: 0.5
                    max_lines: 1
                  # Line numbers appear row by row with the typing.
                  - type: text
                    id: rows
                    text: "1\n2\n3\n4\n5\n6\n7"
                    placement: { anchor: center-left, offset_x: 124, offset_y: 52 }
                    style:
                        { font_size: 50, font_family: "Fira Code", color: "#3A3A44", align: left }
                    max_width_ratio: 0.1
                    keyframes: typing-rows
                  # The highlight sits under the code and grows out of its center.
                  - type: rect
                    id: highlight
                    start: 2.6s
                    width: 312
                    height: 56
                    corner_radius: 10
                    color: "#D7FF3E"
                    placement: { anchor: top-left, offset_x: 428, offset_y: 1134 }
                    keyframes: [{ at: 0s, scale_x: 0, ease: ease-out }, { at: 0.3s, scale_x: 1 }]
                  # Syntax colors: the same $(CODE) four times, each layer drawing only
                  # what its match covers, all typed by one shared preset.
                  # Fira Code at 50 px: a character is 25 px wide, a line 50 px tall.
                  - {
                        type: text,
                        id: code-keys,
                        text: $(CODE),
                        match: "([A-Za-z0-9_]+):",
                        placement: { anchor: center-left, offset_x: 184, offset_y: 52 },
                        style:
                            {
                                font_size: 50,
                                font_family: "Fira Code",
                                color: "#F3F1EA",
                                align: left,
                            },
                        max_width_ratio: 0.8,
                        keyframes: typing,
                    }
                  - {
                        type: text,
                        id: code-punct,
                        text: $(CODE),
                        match: ":",
                        placement: { anchor: center-left, offset_x: 184, offset_y: 52 },
                        style:
                            {
                                font_size: 50,
                                font_family: "Fira Code",
                                color: "#6E6E78",
                                align: left,
                            },
                        max_width_ratio: 0.8,
                        keyframes: typing,
                    }
                  - {
                        type: text,
                        id: code-strings,
                        text: $(CODE),
                        match: '"[^"]*"',
                        placement: { anchor: center-left, offset_x: 184, offset_y: 52 },
                        style:
                            {
                                font_size: 50,
                                font_family: "Fira Code",
                                color: "#D7FF3E",
                                align: left,
                            },
                        max_width_ratio: 0.8,
                        keyframes: typing,
                    }
                  - {
                        type: text,
                        id: code-values,
                        text: $(CODE),
                        match: "(?m): ([a-z]+)$",
                        placement: { anchor: center-left, offset_x: 184, offset_y: 52 },
                        style:
                            {
                                font_size: 50,
                                font_family: "Fira Code",
                                color: "#9D8CFF",
                                align: left,
                            },
                        max_width_ratio: 0.8,
                        keyframes: typing,
                    }
                  # The highlighted string turns ink on the volt highlight.
                  - {
                        type: text,
                        id: code-highlight,
                        start: 2.6s,
                        text: $(CODE),
                        match: $(HIGHLIGHT),
                        placement: { anchor: center-left, offset_x: 184, offset_y: 52 },
                        style:
                            {
                                font_size: 50,
                                font_family: "Fira Code",
                                color: "#0B0B0D",
                                align: left,
                            },
                        max_width_ratio: 0.8,
                    }
                  # The cursor: the code turned into full blocks (plus one after the
                  # end), of which a one-character reveal window shows the cell after
                  # the typed text. It leaves when the highlight lands.
                  - {
                        type: text,
                        id: cursor,
                        duration: 2.6s,
                        text: "$(CODE) ",
                        replace: { pattern: '[^\n]', with: "█" },
                        placement: { anchor: center-left, offset_x: 184, offset_y: 52 },
                        style:
                            {
                                font_size: 50,
                                font_family: "Fira Code",
                                color: "#D7FF3E",
                                align: left,
                            },
                        max_width_ratio: 0.8,
                        keyframes: cursor-window,
                    }
                  # A short jolt when the highlight lands moves the whole editor.
                  - {
                        type: effect,
                        start: 2.6s,
                        duration: 0.25s,
                        effects: [{ type: shake, amount: 5, frequency: 22 }],
                    }
            - type: text
              text: $(BOTTOM)
              start: 2.6s
              placement: { anchor: center, offset_y: 430 }
              style:
                  { font_size: 88, weight: bold, color: "#D7FF3E", align: center, word_spacing: 15 }
              max_width_ratio: 1
              max_lines: 1
              keyframes: slam
            - { type: audio, path: assets/sfx-pop.wav, start: 2.6s, duration: 0.3s, volume: 0.7 }

    # ── Shout: one word per beat on a full-bleed color ────────────────────────
    shout:
        duration: 1s # two beats; a cut doesn't overlap the next scene
        transition_out: { type: cut }
        elements:
            - { type: rect, width: 1080, height: 1920, color: $(BG), placement: { anchor: center } }
            - type: text
              text: $(WORD)
              placement: { anchor: center, offset_y: -20 }
              style: { font_size: 176, weight: bold, color: "#0B0B0D", align: center }
              max_width_ratio: 1
              max_lines: 2
              keyframes: shout

    # The last word of the run: volt on ink, leaving through a glitch.
    shout-ink:
        background: "#0B0B0D"
        duration: 1.5s
        transition_out: { type: glitch-cut }
        elements:
            - type: text
              text: $(WORD)
              placement: { anchor: center, offset_y: -20 }
              style: { font_size: 176, weight: bold, color: "#D7FF3E", align: center }
              max_width_ratio: 1
              max_lines: 2
              keyframes: shout
            - { type: audio, path: assets/sfx-glitch.wav, start: 1.3s, duration: 0.2s, volume: 0.6 }

    # ── Counter: a number that counts itself up through element clips ────────
    count:
        background: "#0B0B0D"
        duration: 2.9s
        transition_out: { type: circle-open, duration: 0.4s }
        elements:
            - {
                  type: image,
                  path: assets/grid.png,
                  placement: { anchor: center },
                  fit: cover,
                  opacity: 0.5,
              }
            - type: text
              id: number
              text: "0"
              placement: { anchor: center, offset_y: -80 }
              style: { font_size: 440, weight: bold, color: "#D7FF3E", align: center }
              max_width_ratio: 1
              max_lines: 1
            - type: text
              text: $(CAPTION)
              start: 0.5s
              placement: { anchor: center, offset_y: 220 }
              style: { font_size: 48, font_family: "Fira Code", align: center }
              max_width_ratio: 1
              max_lines: 1
              keyframes: rise
            - { type: audio, path: assets/sfx-tick.wav, start: 0.1s, duration: 0.06s, volume: 0.3 }
            - { type: audio, path: assets/sfx-tick.wav, start: 0.2s, duration: 0.06s, volume: 0.3 }
            - { type: audio, path: assets/sfx-tick.wav, start: 0.3s, duration: 0.06s, volume: 0.3 }
            - { type: audio, path: assets/sfx-tick.wav, start: 0.4s, duration: 0.06s, volume: 0.3 }
            - { type: audio, path: assets/sfx-tick.wav, start: 0.5s, duration: 0.06s, volume: 0.3 }
            - { type: audio, path: assets/sfx-tick.wav, start: 0.6s, duration: 0.06s, volume: 0.3 }
            - { type: audio, path: assets/sfx-tick.wav, start: 0.7s, duration: 0.06s, volume: 0.3 }
            - { type: audio, path: assets/sfx-pop.wav, start: 0.8s, duration: 0.16s, volume: 0.6 }
            - {
                  type: audio,
                  path: assets/sfx-whoosh.wav,
                  start: -0.55s,
                  duration: 0.5s,
                  volume: 0.45,
              }
        tracks:
            - id: count-up
              clips:
                  - {
                        type: element,
                        target: number,
                        start: 0.1s,
                        duration: 0.1s,
                        set: { text: "7" },
                    }
                  - {
                        type: element,
                        target: number,
                        start: 0.2s,
                        duration: 0.1s,
                        set: { text: "16" },
                    }
                  - {
                        type: element,
                        target: number,
                        start: 0.3s,
                        duration: 0.1s,
                        set: { text: "24" },
                    }
                  - {
                        type: element,
                        target: number,
                        start: 0.4s,
                        duration: 0.1s,
                        set: { text: "33" },
                    }
                  - {
                        type: element,
                        target: number,
                        start: 0.5s,
                        duration: 0.1s,
                        set: { text: "41" },
                    }
                  - {
                        type: element,
                        target: number,
                        start: 0.6s,
                        duration: 0.1s,
                        set: { text: "49" },
                    }
                  - {
                        type: element,
                        target: number,
                        start: 0.7s,
                        duration: 0.1s,
                        set: { text: "55" },
                    }
                  - type: element
                    target: number
                    start: 0.8s
                    set: { text: $(NUMBER) }
                    keyframes: [{ at: 0s, scale: 1.15, ease: back-out }, { at: 0.35s, scale: 1 }]

    # ── Transition names, on light and dark grounds ──────────────────────────
    # Items set their own transitions: each card names the one that brought it in.
    tname-light:
        duration: 1.4s
        elements:
            - { type: rect, width: 1080, height: 1920, color: $(BG), placement: { anchor: center } }
            - type: text
              text: "transition:"
              placement: { anchor: center, offset_y: -130 }
              style: { font_size: 40, font_family: "Fira Code", color: "#0B0B0D", align: center }
              max_width_ratio: 1
              max_lines: 1
            - type: text
              text: $(NAME)
              placement: { anchor: center, offset_y: -10 }
              style:
                  {
                      font_size: 104,
                      font_family: "Fira Code",
                      weight: bold,
                      color: "#0B0B0D",
                      align: center,
                  }
              max_width_ratio: 1
              max_lines: 1
              keyframes: settle
            - type: text
              text: $(SUB)
              optional: true
              start: 0.15s
              placement: { anchor: center, offset_y: 130 }
              style: { font_size: 34, font_family: "Fira Code", color: "#0B0B0D", align: center }
              max_width_ratio: 1
              max_lines: 1
              keyframes: [{ at: 0s, chars_end: 0 }, { at: 0.6s, chars_end: "100%" }]
            - {
                  type: audio,
                  path: assets/sfx-whoosh.wav,
                  start: -0.55s,
                  duration: 0.5s,
                  volume: 0.4,
              }

    tname-dark:
        duration: 1.4s
        elements:
            - { type: rect, width: 1080, height: 1920, color: $(BG), placement: { anchor: center } }
            - type: text
              text: "transition:"
              placement: { anchor: center, offset_y: -130 }
              style: { font_size: 40, font_family: "Fira Code", color: "#6E6E78", align: center }
              max_width_ratio: 1
              max_lines: 1
            - type: text
              text: $(NAME)
              placement: { anchor: center, offset_y: -10 }
              style:
                  {
                      font_size: 104,
                      font_family: "Fira Code",
                      weight: bold,
                      color: "#D7FF3E",
                      align: center,
                  }
              max_width_ratio: 1
              max_lines: 1
              keyframes: settle
            - {
                  type: audio,
                  path: assets/sfx-whoosh.wav,
                  start: -0.55s,
                  duration: 0.5s,
                  volume: 0.4,
              }

    # ── Easing lab: three dots, three easings ────────────────────────────────
    easing:
        background: "#F3F1EA"
        duration: 3.45s
        transition_out: { type: radial, duration: 0.45s }
        elements:
            - type: text
              text: $(TITLE)
              placement: { anchor: top-center, offset_y: 250 }
              style: { font_size: 120, weight: bold, color: "#0B0B0D", align: center }
              max_width_ratio: 1
              max_lines: 1
              keyframes: rise
            - {
                  type: text,
                  text: $(E1),
                  placement: { anchor: center, offset_y: -250 },
                  style: { font_size: 36, font_family: "Fira Code", color: "#6E6E78", align: left },
                  max_width_ratio: 0.71,
                  max_lines: 1,
              }
            - {
                  type: rect,
                  width: 760,
                  height: 4,
                  corner_radius: 2,
                  color: "#D9D6CC",
                  placement: { anchor: center, offset_y: -180 },
              }
            - {
                  type: circle,
                  id: dot1,
                  width: 72,
                  height: 72,
                  color: "#0B0B0D",
                  placement: { anchor: center, offset_x: -380, offset_y: -180 },
              }
            - {
                  type: text,
                  text: $(E2),
                  placement: { anchor: center, offset_y: -30 },
                  style: { font_size: 36, font_family: "Fira Code", color: "#6E6E78", align: left },
                  max_width_ratio: 0.71,
                  max_lines: 1,
              }
            - {
                  type: rect,
                  width: 760,
                  height: 4,
                  corner_radius: 2,
                  color: "#D9D6CC",
                  placement: { anchor: center, offset_y: 40 },
              }
            - {
                  type: circle,
                  id: dot2,
                  width: 72,
                  height: 72,
                  color: "#0B0B0D",
                  placement: { anchor: center, offset_x: -380, offset_y: 40 },
              }
            - {
                  type: text,
                  text: $(E3),
                  placement: { anchor: center, offset_y: 190 },
                  style: { font_size: 36, font_family: "Fira Code", color: "#6E6E78", align: left },
                  max_width_ratio: 0.71,
                  max_lines: 1,
              }
            - {
                  type: rect,
                  width: 760,
                  height: 4,
                  corner_radius: 2,
                  color: "#D9D6CC",
                  placement: { anchor: center, offset_y: 260 },
              }
            - {
                  type: circle,
                  id: dot3,
                  width: 72,
                  height: 72,
                  color: "#0B0B0D",
                  placement: { anchor: center, offset_x: -380, offset_y: 260 },
              }
            - type: text
              text: $(CAPTION)
              start: 0.4s
              placement: { anchor: center, offset_y: 470 }
              style: { font_size: 34, font_family: "Fira Code", color: "#6E6E78", align: center }
              max_width_ratio: 1
              max_lines: 1
              keyframes: rise
            - {
                  type: audio,
                  path: assets/sfx-swish.wav,
                  start: 0.5s,
                  duration: 0.32s,
                  volume: 0.45,
              }
            - { type: audio, path: assets/sfx-swish.wav, start: 2s, duration: 0.32s, volume: 0.35 }
        tracks:
            # Each row runs its dot right with its easing, then home again.
            - id: easing-dots
              clips:
                  - type: element
                    target: dot1
                    start: 0.5s
                    keyframes:
                        - { at: 0s, x: 0, ease: ease-out }
                        - { at: 1.1s, x: 760, ease: ease-in-out }
                        - { at: 1.5s, x: 760, ease: ease-out }
                        - { at: 2.4s, x: 0 }
                  # back-out overshoots ~10 % (76 px): the dot stays on screen.
                  - type: element
                    target: dot2
                    start: 0.5s
                    keyframes:
                        - { at: 0s, x: 0, ease: back-out }
                        - { at: 1.1s, x: 760, ease: ease-in-out }
                        - { at: 1.5s, x: 760, ease: back-out }
                        - { at: 2.4s, x: 0 }
                  - type: element
                    target: dot3
                    start: 0.5s
                    keyframes:
                        - { at: 0s, x: 0, ease: bounce-out }
                        - { at: 1.1s, x: 760, ease: ease-in-out }
                        - { at: 1.5s, x: 760, ease: bounce-out }
                        - { at: 2.4s, x: 0 }

    # ── Effect layers over a halftone sphere, one per beat ───────────────────
    fx:
        background: "#0B0B0D"
        duration: 4s
        transition_out: { type: punch }
        elements:
            - type: text
              text: $(TITLE)
              placement: { anchor: top-center, offset_y: 250 }
              style: { font_size: 104, weight: bold, align: center, word_spacing: 18 }
              max_width_ratio: 1
              max_lines: 1
              keyframes: rise
            - type: image
              path: assets/orb.png
              placement: { anchor: center, offset_y: 30 }
              max_width_ratio: 0.72
              max_height_ratio: 0.41
              fit: contain
              keyframes:
                  - { at: 0s, scale: 0.85, opacity: 0, rotation: -20, ease: ease-out }
                  - { at: 0.5s, scale: 1, opacity: 1, rotation: 0, ease: linear }
                  - { at: -0s, rotation: 14 }
            # Effect elements grade everything listed above them...
            - {
                  type: effect,
                  start: 0.5s,
                  duration: 0.5s,
                  effects: [{ type: glow, radius: 26, strength: 0.9 }],
              }
            - {
                  type: effect,
                  start: 1s,
                  duration: 0.5s,
                  effects: [{ type: rgb_split, amount: 22 }],
              }
            - {
                  type: effect,
                  start: 1.5s,
                  duration: 0.5s,
                  effects: [{ type: color, hue: 150, saturation: 1.4 }],
              }
            - {
                  type: effect,
                  start: 2s,
                  duration: 0.5s,
                  effects: [{ type: grain, amount: 45 }, { type: color, contrast: 1.3 }],
              }
            - {
                  type: effect,
                  start: 2.5s,
                  duration: 0.5s,
                  effects:
                      [
                          { type: shake, amount: 16, frequency: 18 },
                          { type: tint, color: "#FF5C39", opacity: 0.12 },
                      ],
              }
            - {
                  type: effect,
                  start: 3s,
                  duration: 0.5s,
                  keyframes: [{ at: 0s, scale: 1.08, ease: ease-out }, { at: 0.5s, scale: 1 }],
              }
            # ...so the label chips after them stay clean. Each chip is a folder:
            # a rect sized to its text (22 px per character) and the text, popping in together.
            - type: folder
              start: 0.5s
              duration: 0.5s
              keyframes: chip
              clips:
                  - {
                        type: rect,
                        width: 136,
                        height: 68,
                        corner_radius: 34,
                        color: "#D7FF3E",
                        placement: { anchor: center, offset_y: 520 },
                    }
                  - {
                        type: text,
                        text: "glow",
                        placement: { anchor: center, offset_y: 520 },
                        style:
                            {
                                font_size: 44,
                                font_family: "Fira Code",
                                weight: bold,
                                color: "#0B0B0D",
                                align: center,
                            },
                        max_width_ratio: 1,
                        max_lines: 1,
                    }
            - type: folder
              start: 1s
              duration: 0.5s
              keyframes: chip
              clips:
                  - {
                        type: rect,

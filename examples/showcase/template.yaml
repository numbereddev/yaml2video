    # ── One template, three videos: the phones move as one group ─────────────
    phones:
        background: "#D7FF3E"
        duration: 3.4s
        transition_out: { type: slide-left, duration: 0.4s }
        elements:
            - type: text
              text: $(TOP)
              placement: { anchor: top-center, offset_y: 400 }
              style:
                  {
                      font_size: 104,
                      weight: bold,
                      color: "#0B0B0D",
                      align: center,
                      word_spacing: 18,
                  }
              max_width_ratio: 1
              max_lines: 1
              keyframes: rise
            - type: folder
              id: deck
              # The group leans in and settles while each phone flies in on its own beat.
              keyframes:
                  - { at: 0.2s, rotation: -3, scale: 0.94, ease: ease-in-out }
                  - { at: 1.6s, rotation: 0, scale: 1, ease: ease-in-out }
                  - { at: -0s, scale: 1.03 }
              clips:
                  - type: image
                    path: $(P1)
                    placement: { anchor: center, offset_x: -330, offset_y: 30 }
                    max_width_ratio: 0.28
                    max_height_ratio: 0.33
                    fit: contain
                    keyframes:
                        [
                            { at: 0.15s, y: 700, rotation: 0, ease: back-out },
                            { at: 0.75s, y: 30, rotation: -7 },
                        ]
                  - type: image
                    path: $(P2)
                    placement: { anchor: center, offset_y: 0 }
                    max_width_ratio: 0.28
                    max_height_ratio: 0.33
                    fit: contain
                    keyframes: [{ at: 0.3s, y: 700, ease: back-out }, { at: 0.9s, y: 0 }]
                  - type: image
                    path: $(P3)
                    placement: { anchor: center, offset_x: 330, offset_y: 30 }
                    max_width_ratio: 0.28
                    max_height_ratio: 0.33
                    fit: contain
                    keyframes:
                        [
                            { at: 0.45s, y: 700, rotation: 0, ease: back-out },
                            { at: 1.05s, y: 30, rotation: 7 },
                        ]
            - type: text
              text: $(BOTTOM)
              start: 1.35s
              placement: { anchor: center, offset_y: 470 }
              style:
                  {
                      font_size: 104,
                      weight: bold,
                      color: "#0B0B0D",
                      align: center,
                      word_spacing: 18,
                  }
              max_width_ratio: 1
              max_lines: 1
              keyframes: slam
            - { type: audio, path: assets/sfx-pop.wav, start: 0.15s, duration: 0.16s, volume: 0.45 }
            - { type: audio, path: assets/sfx-pop.wav, start: 0.3s, duration: 0.16s, volume: 0.45 }
            - { type: audio, path: assets/sfx-pop.wav, start: 0.45s, duration: 0.16s, volume: 0.45 }
            - {
                  type: audio,
                  path: assets/sfx-impact.wav,
                  start: 1.35s,
                  duration: 1.8s,
                  volume: 0.45,
              }

    # ── Sound: a mirrored equalizer pulsing on the beat ──────────────────────
    eq:
        background: "#0B0B0D"
        duration: 2.5s
        transition_out: { type: glitch-cut }

              }
            - {
                  type: rect,
                  width: 52,
                  height: 460,
                  corner_radius: 26,
                  color: "#F3F1EA",
                  placement: { anchor: center, offset_y: 30 },
                  keyframes: pulse-a,
              }
            - {
                  type: rect,
                  width: 52,
                  height: 460,
                  corner_radius: 26,
                  color: "#D7FF3E",
                  placement: { anchor: center, offset_x: 80, offset_y: 30 },
                  keyframes: pulse-b,
              }
            - {
                  type: rect,
                  width: 52,
                  height: 460,
                  corner_radius: 26,
                  color: "#D7FF3E",
                  placement: { anchor: center, offset_x: 160, offset_y: 30 },
                  keyframes: pulse-a,
              }
            - {
                  type: rect,
                  width: 52,
                  height: 460,
                  corner_radius: 26,
                  color: "#D7FF3E",
                  placement: { anchor: center, offset_x: 240, offset_y: 30 },
                  keyframes: pulse-b,
              }
            - {
                  type: rect,
                  width: 52,
                  height: 460,
                  corner_radius: 26,
                  color: "#D7FF3E",
                  placement: { anchor: center, offset_x: 320, offset_y: 30 },
                  keyframes: pulse-c,
              }
            - {
                  type: rect,
                  width: 52,
                  height: 460,
                  corner_radius: 26,
                  color: "#D7FF3E",
                  placement: { anchor: center, offset_x: 400, offset_y: 30 },
                  keyframes: pulse-d,
              }
            - type: text
              text: $(CAPTION)
              start: 0.3s
              placement: { anchor: center, offset_y: 440 }
              style: { font_size: 36, font_family: "Fira Code", color: "#6E6E78", align: center }
              max_width_ratio: 1
              max_lines: 1
              keyframes: [{ at: 0s, chars_end: 0 }, { at: 0.8s, chars_end: "100%" }]
            - {
                  type: audio,
                  path: assets/sfx-glitch.wav,
                  start: -0.25s,
                  duration: 0.25s,
                  volume: 0.5,
              }

    # ── One command: a terminal folder that types, renders, and reports ──────
    cli:
        background: "#0B0B0D"
        duration: 3.9s
        transition_out: { type: zoom-in, duration: 0.4s }
        elements:
            - type: text
              text: $(TITLE)
              placement: { anchor: top-center, offset_y: 250 }
              style: { font_size: 104, weight: bold, align: center, word_spacing: 18 }
              max_width_ratio: 1
              max_lines: 1
              keyframes: rise
            - type: folder
              id: terminal
              keyframes:
                  - { at: 0s, y: 140, scale: 0.94, opacity: 0, ease: back-out }
                  - { at: 0.45s, y: 0, scale: 1, opacity: 1 }
                  - { at: 2.5s, scale: 1, ease: back-out }
                  - { at: 2.6s, scale: 1.025, ease: ease-out }
                  - { at: 2.9s, scale: 1 }
              clips:
                  - type: image
                    path: assets/terminal.png
                    placement: { anchor: center, offset_y: 20 }
                    max_width_ratio: 0.871
                    max_height_ratio: 0.282
                    fit: contain
                  # The command types itself; a block cursor runs ahead of it.
                  - type: text
                    id: cmd
                    text: $(COMMAND)
                    placement: { anchor: center-left, offset_x: 130, offset_y: -90 }
                    style: { font_size: 40, font_family: "Fira Code", align: left }
                    max_width_ratio: 0.85
                    max_lines: 1
                    keyframes: [{ at: 0.45s, chars_end: 0 }, { at: 1.15s, chars_end: "100%" }]
                  - type: rect
                    width: 20
                    height: 40
                    color: "#D7FF3E"
                    placement: { anchor: top-left, offset_x: 130, offset_y: 850 }
                    duration: 1.45s
                    keyframes:
                        [
                            { at: 0s, opacity: 1, ease: step },
                            { at: 0.45s, x: 0 },
                            { at: 1.15s, x: 460, ease: step },
                            { at: 1.2s, opacity: 0, ease: step },
                            { at: 1.3s, opacity: 1 },
                        ]
                  - type: text
                    id: status
                    text: $(STATUS)
                    start: 1.45s
                    placement: { anchor: center-left, offset_x: 130, offset_y: 0 }
                    style:
                        { font_size: 36, font_family: "Fira Code", color: "#6E6E78", align: left }
                    max_width_ratio: 0.85
                    max_lines: 1
                  - type: text
                    id: bar
                    text: "░░░░░░░░░░░░░░░░   0%"
                    start: 1.45s
                    placement: { anchor: center-left, offset_x: 130, offset_y: 80 }
                    style:
                        { font_size: 36, font_family: "Fira Code", color: "#D7FF3E", align: left }
                    max_width_ratio: 0.85
                    max_lines: 1
                  - type: text
                    text: $(DONE)
                    start: 2.5s
                    placement: { anchor: center-left, offset_x: 130, offset_y: 170 }
                    style:
                        {
                            font_size: 36,
                            font_family: "Fira Code",
                            weight: bold,
                            color: "#D7FF3E",
                            align: left,
                        }
                    max_width_ratio: 0.85
                    max_lines: 1
                    keyframes: settle
            - {
                  type: audio,
                  path: assets/sfx-typing.wav,
                  start: 0.45s,
                  duration: 0.75s,
                  volume: 0.5,
              }
            - { type: audio, path: assets/sfx-key.wav, start: 1.35s, duration: 0.09s, volume: 0.6 }
            # A chime that ducks the music when the render completes.
            # It is short so the music is back before the end card's hit.
            - {
                  type: audio,
                  path: assets/sfx-chime.wav,
                  start: 2.5s,
                  duration: 0.6s,
                  volume: 0.7,
                  fade_out: 0.25s,
                  ducks: true,
              }
        tracks:
            # Rendering: the bar and the status change in place.
            - id: render-progress
              clips:
                  - {
                        type: element,
                        target: bar,
                        start: 1.65s,
                        duration: 0.2s,
                        set: { text: "████░░░░░░░░░░░░  24%" },
                    }
                  - {
                        type: element,
                        target: bar,
                        start: 1.85s,
                        duration: 0.2s,
                        set: { text: "████████░░░░░░░░  51%" },
                    }
                  - {
                        type: element,
                        target: bar,
                        start: 2.05s,
                        duration: 0.2s,
                        set: { text: "████████████░░░░  77%" },
                    }
                  - {
                        type: element,
                        target: bar,
                        start: 2.25s,
                        duration: 0.25s,
                        set: { text: "███████████████░  96%" },
                    }
                  - {
                        type: element,
                        target: bar,
                        start: 2.5s,
                        set: { text: "████████████████ 100%" },
                    }
                  - { type: element, target: status, start: 2.5s, set: { text: $(STATUS_DONE) } }

    # ── End card: mark, wordmark and tagline breathe together ────────────────
    end:
        background: "#0B0B0D"
        duration: 3.5s
        elements:
            - type: image
              path: assets/grid.png
              placement: { anchor: center }
              fit: cover
              opacity: 0.6
              effects:
                  [
                      {
                          type: pan_zoom,
                          from_scale: 1.06,
                          to_scale: 1,
                          from_anchor: center,
                          to_anchor: center,
                      },
                  ]
            - type: folder
              id: brand
              keyframes: [{ at: 0.6s, scale: 1, ease: ease-in-out }, { at: -0s, scale: 1.05 }]
              clips:
                  - type: image
                    path: assets/logo.png
                    placement: { anchor: center, offset_y: -300 }
                    max_width_ratio: 0.24
                    max_height_ratio: 0.14
                    fit: contain
                    keyframes:
                        - { at: 0s, scale: 0.3, rotation: -25, opacity: 0, ease: back-out }
                        - { at: 0.55s, scale: 1, rotation: 0, opacity: 1 }
                  - type: text
                    text: $(title)
                    start: 0.25s
                    placement: { anchor: center, offset_y: -40 }
                    style: { font_size: 140, weight: bold, align: center }
                    max_width_ratio: 1
                    max_lines: 1
                    keyframes: rise
                  - type: text
                    text: $(text)
                    start: 0.55s
                    placement: { anchor: center, offset_y: 100 }
                    style:
                        { font_size: 42, font_family: "Fira Code", color: "#D7FF3E", align: center }
                    max_width_ratio: 1
                    max_lines: 1
                    keyframes: [{ at: 0s, chars_end: 0 }, { at: 0.6s, chars_end: "100%" }]
            # The call to action: a pill sized to its text (16 px per character at 32 px).
            - type: folder
              start: 1.1s
              keyframes: settle
              clips:
                  - {
                        type: rect,
                        width: 528,
                        height: 72,
                        corner_radius: 36,
                        color: "#F3F1EA",
                        placement: { anchor: center, offset_y: 330 },
                    }
                  - {
                        type: text,
                        text: $(cta),
                        placement: { anchor: center, offset_y: 330 },
                        style:
                            {
                                font_size: 32,
                                font_family: "Fira Code",
                                weight: bold,
                                color: "#0B0B0D",
                                align: center,
                            },
                        max_width_ratio: 1,
                        max_lines: 1,
                    }
            - { type: audio, path: assets/sfx-impact.wav, start: 0s, duration: 1.8s, volume: 0.6 }
        tracks:
            # Fade to ink so the short loops cleanly into the hook.
            - id: end-fade
              clips:
                  - type: effect
                    start: -0.5s
                    effects: [{ type: tint, color: "#0B0B0D", opacity: 1 }]
                    keyframes: fade-to-ink

advanced:
    master:
        loudness: -14
        true_peak: -1.5

    keyframes:
        rise:
            - { at: 0s, y: 70, opacity: 0, ease: back-out }
            - { at: 0.5s, y: 0, opacity: 1 }
        slam:
            - { at: 0s, scale: 1.35, opacity: 0, ease: back-out }
            - { at: 0.4s, scale: 1, opacity: 1 }
        settle:
            - { at: 0s, scale: 0.8, opacity: 0, ease: back-out }
            - { at: 0.35s, scale: 1, opacity: 1 }
        # Chips replace each other on the beat, so they pop without fading:
        # a transparent first frame would read as a blink between chips.
        chip:
            - { at: 0s, scale: 0.8, ease: back-out }
            - { at: 0.2s, scale: 1 }
        chip-out:
            - { at: -0.25s, scale: 1, opacity: 1, ease: back-in }
            - { at: -0s, scale: 0.6, opacity: 0 }
        shout:
            - { at: 0s, scale: 1.15, opacity: 0, ease: ease-out }
            - { at: 0.2s, scale: 1, opacity: 1, ease: linear }
            - { at: -0s, scale: 1.05 }
        fade-to-ink:
            - { at: -0.5s, opacity: 0, ease: ease-in }
            - { at: -0s, opacity: 1 }
        # Typing defaults for the code layout; a video overrides them with
        # timings that fit its code.
        typing:
            - { at: 0.5s, chars_end: 0 }
            - { at: 2.5s, chars_end: "100%" }
        typing-rows:
            - { at: 0s, lines_end: "100%" }
        cursor-window:
            - { at: 0s, chars_start: 0, chars_end: 0 }
        # The equalizer: one kick per beat, four intensities.
        pulse-a:
            - { at: 0s, scale_y: 1, ease: ease-out }
            - { at: 0.4s, scale_y: 0.16, ease: linear }
            - { at: 0.5s, scale_y: 0.6, ease: ease-out }
            - { at: 0.9s, scale_y: 0.16, ease: linear }
            - { at: 1s, scale_y: 0.85, ease: ease-out }
            - { at: 1.4s, scale_y: 0.16, ease: linear }
            - { at: 1.5s, scale_y: 0.55, ease: ease-out }
            - { at: 1.9s, scale_y: 0.16, ease: linear }
            - { at: 2s, scale_y: 0.95, ease: ease-out }
            - { at: 2.45s, scale_y: 0.12 }
        pulse-b:
            - { at: 0s, scale_y: 0.7, ease: ease-out }
            - { at: 0.4s, scale_y: 0.14, ease: linear }
            - { at: 0.5s, scale_y: 0.9, ease: ease-out }
            - { at: 0.9s, scale_y: 0.14, ease: linear }
            - { at: 1s, scale_y: 0.5, ease: ease-out }
            - { at: 1.4s, scale_y: 0.14, ease: linear }
            - { at: 1.5s, scale_y: 0.8, ease: ease-out }
            - { at: 1.9s, scale_y: 0.14, ease: linear }
            - { at: 2s, scale_y: 0.65, ease: ease-out }
            - { at: 2.45s, scale_y: 0.12 }
        pulse-c:
            - { at: 0s, scale_y: 0.45, ease: ease-out }
            - { at: 0.4s, scale_y: 0.12, ease: linear }
            - { at: 0.5s, scale_y: 0.6, ease: ease-out }
            - { at: 0.9s, scale_y: 0.12, ease: linear }
            - { at: 1s, scale_y: 0.7, ease: ease-out }
            - { at: 1.4s, scale_y: 0.12, ease: linear }
            - { at: 1.5s, scale_y: 0.4, ease: ease-out }
            - { at: 1.9s, scale_y: 0.12, ease: linear }
            - { at: 2s, scale_y: 0.55, ease: ease-out }
            - { at: 2.45s, scale_y: 0.12 }
        pulse-d:
            - { at: 0s, scale_y: 0.25, ease: ease-out }
            - { at: 0.4s, scale_y: 0.1, ease: linear }
            - { at: 0.5s, scale_y: 0.35, ease: ease-out }
            - { at: 0.9s, scale_y: 0.1, ease: linear }
            - { at: 1s, scale_y: 0.3, ease: ease-out }
            - { at: 1.4s, scale_y: 0.1, ease: linear }
            - { at: 1.5s, scale_y: 0.4, ease: ease-out }
            - { at: 1.9s, scale_y: 0.1, ease: linear }
            - { at: 2s, scale_y: 0.3, ease: ease-out }
            - { at: 2.45s, scale_y: 0.1 }

    effects:
        glitch:
            - { type: rgb_split, amount: 18 }
            - { type: shake, amount: 12, frequency: 24 }

    transitions:
        # A cut hidden under a burst of chromatic split and shake.
        glitch-cut:
            duration: 0.3s
            effects: glitch
            keyframes:
                - { at: 0s, opacity: 0, ease: ease-out }
                - { at: 0.12s, opacity: 1, ease: ease-in }
                - { at: 0.3s, opacity: 0 }
        # A short dissolve while the out side zooms into a blur and the in side out of it.
        zoom-blur:
            duration: 0.35s
            base: fade
            out:
                effects: [{ type: blur, radius: 14 }]
                keyframes:
                    [
                        { at: 0s, scale: 1, opacity: 0, ease: ease-in },
                        { at: -0s, scale: 1.3, opacity: 1 },
                    ]
            in:
                effects: [{ type: blur, radius: 14 }]
                keyframes:
                    [
                        { at: 0s, scale: 1.3, opacity: 1, ease: ease-out },
                        { at: -0s, scale: 1, opacity: 0 },
                    ]
        # A hard cut whose incoming scene punches in from 112 %.
        punch:
            duration: 0.4s
            in:
                keyframes: [{ at: 0s, scale: 1.12, ease: ease-out }, { at: -0s, scale: 1 }]
        # A custom per-pixel blend: horizontal blinds.
        blinds:
            duration: 0.45s
            expr: "if(lt(mod(Y,96),P*96),B,A)"

    tracks:
        # Every slide that names its source line shows where it lives in the video file.
        - id: source-line
          attach: slide
          clips:
              - type: text
                text: "video.yaml · $(LN)"
                optional: true
                start: 0.2s
                placement: { anchor: top-left, offset_x: 64, offset_y: 190 }
                style: { font_size: 28, font_family: "Fira Code", color: "#7C7C86", align: left }
                max_width_ratio: 0.8
                max_lines: 1
                keyframes: [{ at: 0s, opacity: 0, ease: ease-out }, { at: 0.3s, opacity: 1 }]

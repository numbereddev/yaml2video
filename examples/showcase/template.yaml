                                font_family: "Fira Code",
                                weight: bold,
                                color: "#0B0B0D",
                                align: center,
                            },
                        max_width_ratio: 1,
                        max_lines: 1,
                    }
            - type: folder
              start: 1.5s
              duration: 0.5s
              keyframes: chip
              clips:
                  - {
                        type: rect,
                        width: 224,
                        height: 68,
                        corner_radius: 34,
                        color: "#D7FF3E",
                        placement: { anchor: center, offset_y: 520 },

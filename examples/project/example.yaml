version: 1
video:
    width: 320
    height: 240
    fps: 10
    background: "#202020"
defaults:
    text:
        font: "DejaVu Sans"
        size: 28
        color: "white"
        align: center
        vertical_align: bottom
        background:
            color: "black"
            opacity: 0.5
            padding: 8
            radius: 8
    subtitle:
        font: "DejaVu Sans"
        size: 22
        color: "white"
        transform: bottom-center
        max_width: 280
        background:
            color: "black"
            opacity: 0.6
            padding: 6
            radius: 6
music:
    path: "examples/sample_data/music.wav"
    volume: 0.35
    fade_out: 0.5
scenes:
    - id: first
      duration: 2
      background: "#112233"
      layers:
          - type: image
            path: "examples/sample_data/red.png"
            fit: cover
            transform: center
            opacity: 1
          - type: text
            text:
                - content: "Demo "
                - content: "Video"
                  bold: true
                  color: "#FFD400"
            transform: bottom-center
      transition:
          out:
              type: dissolve
              duration: 0.5
    - id: second
      duration: 2
      background: "#334455"
      layers:
          - type: image
            path: "examples/sample_data/blue.png"
            fit: cover
            transform: center
          - type: rectangle
            width: 256
            height: 60
            transform:
                x: 0.5
                y: 0.5
            color: "rgba(0,0,0,0.6)"
            opacity: 0.8
            radius: 12
      subtitles:
          - duration: 0.8
            text:
                - content: "Unfallatlas 2022"
            transition:
                in:
                    type: fade
                    duration: 0.1
                out:
                    type: fade
                    duration: 0.1
          - duration: 1.2
            text:
                - content: "Daten auf einen Blick."

services:
    yaml2video:
        image: ${DOCKER_IMAGE:-yaml2video:local}
        build:
            context: .
        working_dir: /data
        environment:
            YAML2VIDEO_DATA_DIR: /var/lib/yaml2video
        volumes:
            # - yaml2video-data:/var/lib/yaml2video
            - "${MOUNT_DIR:-./examples}:/data:ro"
        ports:
            - "127.0.0.1:8080:8080"
        command:
            - serve

